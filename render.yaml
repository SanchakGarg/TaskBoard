services:
  - type: web
    name: taskboard
    runtime: docker
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: AUTH_GUEST_ENABLED
        value: "true"
      - key: AUTH_GOOGLE_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_ZITADEL_ENABLED
        value: "false"
      - key: ZITADEL_ISSUER
        sync: false
      - key: ZITADEL_CLIENT_ID
        sync: false
      - key: ZITADEL_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Taskboard <sanchakgargss@gmail.com>

  - type: cron
    name: taskboard-deadline-sweep
    runtime: node
    schedule: "* * * * *"    # every minute for precise deadlines
    buildCommand: ""
    startCommand: >
      curl -s -X POST https://taskboard.onrender.com/api/cron/sweep
      -H "x-cron-secret: $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        sync: false
