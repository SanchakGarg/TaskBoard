services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskboard
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - taskboard-pg-data:/var/lib/postgresql/data

  taskboard:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  taskboard-pg-data:
